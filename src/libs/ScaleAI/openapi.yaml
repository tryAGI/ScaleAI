      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_url
              properties:
                file_url:
                  type: string
                  description: URL of the file to import.
                project_name:
                  type: string
                  description: Project to associate the file with.
      responses:
