  # ─── Files ───
  /files/upload:
    post:
      operationId: uploadFile
      summary: Upload a file
      description: Upload a local file for use as task attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                display_name:
                  type: string
                  description: Human-readable file name.
                project_name:
                  type: string
                  description: Project to associate the file with.
                reference_id:
                  type: string
                  description: Unique upload identifier for idempotency.
                metadata:
                  type: string
                  description: JSON string of additional metadata.
      responses:
        '200':
          description: Uploaded file details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'

  /files/import:
    post:
      operationId: importFile
